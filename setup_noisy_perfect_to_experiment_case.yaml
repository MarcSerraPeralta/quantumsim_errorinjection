version: '1'
name: Real quantum device Surface-17

setup:
  - time_1qubit: 20
    time_2qubit: 60
    time_measure: 300
    cphase_time_int: 48
    cphase_time_rise: 6
    cphase_time_phase_corr: 0
    # CPhase error parameters
#    quasistatic_flux: 0
#    cphase_leakage_rate: 0.005
#    cphase_leakage_phase: 1.5707963267948966
#    cphase_leakage_mobility_rate: 0
#    cphase_leakage_mobility_phase: 0
#    cphase_flux_sensitivity: 0
#    cphase_phase_22: 0
#    cphase_phase_diff_02_12: 3.141592653589793
#    cphase_phase_diff_20_21: 0
#    cphase_phase_corr_error: 0

    # assign_matrix[i, j] = prob(noisy outcome j | ideal outcome or initial state i)

    # Qubit parameters
  - qubit: D4
    frequency: 6802
    T1: 20000
    T1_meas: 20000
    T2: 25000
    T2_int: 25000
    anharmonicity: -299
    meas_prob01: 0
    meas_prob10: 0
    meas_prob12: 0
    meas_prob21: 0
    assign_matrix: [
      [0.98, 0.02, 0.0],
      [0.04, 0.96, 0.0],
      [0.0, 0.0, 1.0]]
  - qubit: Z1
    frequency: 6087
    T1: 14000  # 14000
    T1_meas: 14000
    T2: 14000
    T2_int: 14000
    anharmonicity: -302
    meas_prob01: 0.0
    meas_prob10: 0.05
    meas_prob12: 0
    meas_prob21: 0
    assign_matrix: [
      [0.992, 0.008, 0.0],
      [0.003, 0.997, 0.0],
      [0.00, 0.020, 0.98]]
  - qubit: D1
    frequency: 4843
    T1: 10000
    T1_meas: 10000
    T2: 19000
    T2_int: 19000
    anharmonicity: -314
    meas_prob01: 0
    meas_prob10: 0
    meas_prob12: 0
    meas_prob21: 0
    assign_matrix: [
      [0.98, 0.02, 0.0],
      [0.04, 0.96, 0.0],
      [0.0, 0.0, 1.0]]
  - qubit: X1
    frequency: 5891
    T1: 35000  # 35000
    T1_meas: 35000
    T2: 25000
    T2_int: 25000
    anharmonicity: -302
    meas_prob01: 0
    meas_prob10: 0.015
    meas_prob12: 0
    meas_prob21: 0
    assign_matrix: [
      [0.994, 0.006, 0.0],
      [0.003, 0.997, 0.0],
      [0.00, 0.020, 0.98]]
  - qubit: D2
    frequency: 4788
    T1: 10000
    T1_meas: 10000
    T2: 19000
    T2_int: 19000
    anharmonicity: -317
    meas_prob01: 0
    meas_prob10: 0
    meas_prob12: 0
    meas_prob21: 0
    assign_matrix: [
      [0.98, 0.02, 0.0],
      [0.04, 0.96, 0.0],
      [0.0, 0.0, 1.0]]
  - qubits: ["Z1", "D4"] # qubit static, qubit fluxed
    zz_coupling_wfreq: .00080  # rad / ns
    quasistatic_flux: 0
    cphase_leakage_rate: 0.0017  # L1
    cphase_leakage_phase: 1.5707963267948966
    cphase_leakage_mobility_rate: 0
    cphase_leakage_mobility_phase: 0
    cphase_flux_sensitivity: 0
    cphase_phase_22: 0
    cphase_phase_diff_02_12: 3.141592653589793
    cphase_phase_diff_20_21: 0
    cphase_phase_corr_error_01: -0.00872
    cphase_phase_corr_error_10: 0.005233
    cphase_phase_corr_error_2q: 0.003488
  - qubits: ["D1", "Z1"] # qubit static, qubit fluxed
    zz_coupling_wfreq: .00054  # rad / ns
    quasistatic_flux: 0
    cphase_leakage_rate: 0.0017  # L1
    cphase_leakage_phase: 1.5707963267948966
    cphase_leakage_mobility_rate: 0
    cphase_leakage_mobility_phase: 0
    cphase_flux_sensitivity: 0
    cphase_phase_22: 0
    cphase_phase_diff_02_12: 3.141592653589793
    cphase_phase_diff_20_21: 0
    cphase_phase_corr_error_01: -0.012211
    cphase_phase_corr_error_10: -0.024422
    cphase_phase_corr_error_2q: 0.003488
  - qubits: ["D1", "X1"] # qubit static, qubit fluxed
    zz_coupling_wfreq: .0002  # rad / ns
    quasistatic_flux: 0
    cphase_leakage_rate: 0.015 # L1
    cphase_leakage_phase: 1.5707963267948966
    cphase_leakage_mobility_rate: 0
    cphase_leakage_mobility_phase: 0
    cphase_flux_sensitivity: 0
    cphase_phase_22: 0
    cphase_phase_diff_02_12: 3.141592653589793
    cphase_phase_diff_20_21: 0
    cphase_phase_corr_error_01: -0.057566
    cphase_phase_corr_error_10: -0.017444
    cphase_phase_corr_error_2q: -0.001744
  - qubits: ["D2", "X1"] # qubit static, qubit fluxed
    zz_coupling_wfreq: .0002  # rad / ns
    quasistatic_flux: 0
    cphase_leakage_rate: 0.015 # L1
    cphase_leakage_phase: 1.5707963267948966
    cphase_leakage_mobility_rate: 0
    cphase_leakage_mobility_phase: 0
    cphase_flux_sensitivity: 0
    cphase_phase_22: 0
    cphase_phase_diff_02_12: 3.141592653589793
    cphase_phase_diff_20_21: 0
    cphase_phase_corr_error_01: 0.024422
    cphase_phase_corr_error_10: 0.120366
    cphase_phase_corr_error_2q: 0.087222
  - qubits: ["D2", "Z1"] # qubit static, qubit fluxed
    zz_coupling_wfreq: .00054  # rad / ns
  - qubits: [ "Z1", "D1" ] # qubit static, qubit fluxed
    zz_coupling_wfreq: .0  # rad / ns
  - qubits: [ "Z1", "D2" ] # qubit static, qubit fluxed
    zz_coupling_wfreq: .0  # rad / ns
  - qubits: [ "X1", "D1" ] # qubit static, qubit fluxed
    zz_coupling_wfreq: .0  # rad / ns
  - qubits: [ "X1", "D2" ] # qubit static, qubit fluxed
    zz_coupling_wfreq: .0  # rad / ns
  - qubits: [ "X2", "D2" ] # qubit static, qubit fluxed
    zz_coupling_wfreq: .0  # rad / ns
  - qubits: [ "X2", "D3" ] # qubit static, qubit fluxed
    zz_coupling_wfreq: .0  # rad / ns