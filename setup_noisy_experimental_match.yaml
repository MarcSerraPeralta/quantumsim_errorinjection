    cphase_leakage_rate: 0.0065 # L1
    cphase_leakage_phase: 1.5707963267948966
    cphase_leakage_mobility_rate: 0
    cphase_leakage_mobility_phase: 0
    cphase_flux_sensitivity: 0
    cphase_phase_22: 0
