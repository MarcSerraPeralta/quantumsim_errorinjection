    meas_prob10: 0.107
    meas_prob12: 0.035
    meas_prob21: 0.109
    assign_matrix: [[0.991, 0.002, 0.008], [0.031, 0.967, 0.002], [0.010, 0.060, 0.929]]
  - qubit: D3
