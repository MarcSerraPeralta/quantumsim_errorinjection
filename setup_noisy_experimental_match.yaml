version: '1'
name: Real quantum device Surface-17

setup:
  - time_1qubit: 20
    time_2qubit: 60
    time_measure: 300
    cphase_time_int: 48
    cphase_time_rise: 6
    cphase_time_phase_corr: 0
    # CPhase error parameters
    quasistatic_flux: 0
    cphase_leakage_rate: 0.002
    cphase_leakage_phase: 1.5707963267948966
    cphase_leakage_mobility_rate: 0
    cphase_leakage_mobility_phase: 0
    cphase_flux_sensitivity: 0
    cphase_phase_22: 0
    cphase_phase_diff_02_12: 3.141592653589793
    cphase_phase_diff_20_21: 0
    cphase_phase_corr_error: 0
    # assign_matrix[i, j] = prob(noisy outcome j | ideal outcome or initial 'state i)
    # Qubit parameters
  - qubit: D7
    frequency: 4788
    T1: 18000
    T1_meas: 18000
    T2: 25000
    T2_int: 25000
    anharmonicity: -311
    meas_prob01: 0
    meas_prob10: 0
    meas_prob12: 0
    meas_prob21: 0
    assign_matrix: [[0.999, 0.001, 0.000], [0.032, 0.924, 0.044], [0.004, 0.074, 0.918]]
  - qubit: Z3
    frequency: 6032
    T1: 15500
    T1_meas: 15500
    T2: 18500 #25300
    T2_int: 18500 #25300
    anharmonicity: -291
    meas_prob01: 0.005
    meas_prob10: 0.072
    meas_prob12: 0.001
    meas_prob21: 0.260 # probability |2> decays to |1> during measurement
    # assign_matrix[i, j] = prob(noisy outcome j | ideal outcome or initial 'state i)
    assign_matrix: [[0.993, 0.006, 0.001], [0.031, 0.967, 0.002], [0.026, 0.158, 0.817]]
  - qubit: D4
    frequency: 6802
    T1: 20300
    T1_meas: 20300
    T2: 20200
    T2_int: 20200
    anharmonicity: -299
    meas_prob01: 0.001
    meas_prob10: 0.055
    meas_prob12: 0.002
    meas_prob21: 0.072
    assign_matrix: [
      [0.999, 0.001, 0.000],
      [0.018, 0.798, 0.184],
      [0.005, 0.184, 0.811]]
  - qubit: Z1
    frequency: 6087
    T1: 24500
    T1_meas: 24500
    T2: 15500
    T2_int: 15500
    anharmonicity: -302
    meas_prob01: 0.001
    meas_prob10: 0.039
    meas_prob12: 0.001
    meas_prob21: 0.112
    assign_matrix: [
      [0.991, 0.002, 0.008],
      [0.011, 0.987, 0.002],
      [0.010, 0.060, 0.929]]
  - qubit: D1
    frequency: 4843
    T1: 28500
    T1_meas: 28500
    T2: 3300
    T2_int: 3300
    anharmonicity: -314
    meas_prob01: 0.001
    meas_prob10: 0.032
    meas_prob12: 0.036
    meas_prob21: 0.067
